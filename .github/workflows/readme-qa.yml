name: README QA

on:
  pull_request:
    paths:
      - README.md
      - book/**
      - images/**
      - .github/workflows/release-book.yml
      - .github/workflows/readme-qa.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - book/**
      - images/**
      - .github/workflows/release-book.yml
      - .github/workflows/readme-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  source-and-metadata:
    name: Check source and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Test release metadata
        run: |
          npm ci --prefix book
          npm test --prefix book
          node --check book/qa.mjs
          node --check book/readme-press.config.mjs

      - name: Reject prose whose first strong character is Latin
        run: node book/source-qa.mjs README.md

  workflow-syntax:
    name: Check workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  book:
    name: Build and fully verify all three PDF editions
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install book metadata dependency
        run: npm ci --prefix book

      - name: Install PDF QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Verify PDF QA toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in qpdf pdfinfo pdffonts pdftotext pdfimages pdftoppm; do
            if ! command -v "$tool" >/dev/null; then
              echo "Required PDF QA tool is unavailable: $tool" >&2
              exit 1
            fi
          done

      - name: Build and verify the complete book
        uses: 3lf/readme-press@fa3d3ba5bfb5e2de41a0c3b4fbef290f2928fded # v0.2.0
        env:
          README_PRESS_RELEASE_VERSION: v0.0.0-ci
          README_PRESS_RELEASE_DATE: '2026-08-02'
        with:
          command: pipeline
          config: book/readme-press.config.mjs
          release-version: v0.0.0-ci
          source-commit: ${{ github.sha }}
          render-all: true
          install-pdf-tools: 'false'
