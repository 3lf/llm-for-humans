name: Release book
run-name: Prepare book ${{ inputs.version }} draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable v1.0.1 or prerelease v1.1.0-rc.1
        required: true
        type: string

concurrency:
  group: book-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Validate main and release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Book releases must be prepared from main; selected ref was $GITHUB_REF." >&2
            exit 1
          fi

          version="$REQUESTED_VERSION"
          node book/release-version.mjs "$version" >> "$GITHUB_OUTPUT"
          git fetch --force --tags origin
          if git rev-parse --quiet --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists." >&2
            exit 1
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists." >&2
            exit 1
          fi

      - name: Install and test book metadata
        run: |
          npm ci --prefix book
          npm test --prefix book

      - name: Check volatile-data freshness at release time
        run: node book/volatile-data.mjs README.md

      - name: Install PDF QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Verify PDF QA toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in qpdf pdfinfo pdffonts pdftotext pdfimages pdftoppm; do
            if ! command -v "$tool" >/dev/null; then
              echo "Required PDF QA tool is unavailable: $tool" >&2
              exit 1
            fi
          done

      - name: Capture the release date in Iran time
        id: release-date
        shell: bash
        run: |
          set -euo pipefail
          release_date="$(TZ=Asia/Tehran date +%F)"
          echo "date=$release_date" >> "$GITHUB_OUTPUT"
          echo "Release date: $release_date (Asia/Tehran)"

      - name: Build and fully verify all three PDF editions
        uses: 3lf/readme-press@fa3d3ba5bfb5e2de41a0c3b4fbef290f2928fded # v0.2.0
        env:
          README_PRESS_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          README_PRESS_RELEASE_DATE: ${{ steps.release-date.outputs.date }}
        with:
          command: pipeline
          config: book/readme-press.config.mjs
          release-version: ${{ steps.release.outputs.version }}
          source-commit: ${{ github.sha }}
          render-all: true
          install-pdf-tools: 'false'

      - name: Recheck release checksums
        working-directory: book/dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-for-humans-book-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            book/dist/llm-for-humans-book.pdf
            book/dist/llm-for-humans-book-print.pdf
            book/dist/llm-for-humans-book-high-quality.pdf
            book/dist/SHA256SUMS.txt
            book/dist/manifest.json
            book/dist/release-notes.md

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: llm-for-humans-book-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify downloaded release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION was created while the build was running." >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION was created while the build was running." >&2
            exit 1
          fi

          notes="$(< release-assets/release-notes.md)"
          flags=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "LLM به زبان آدمیزاد $VERSION"
            --draft
            --generate-notes
            --notes "$notes"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi

          gh release create "$VERSION" \
            "release-assets/llm-for-humans-book.pdf#نسخه عادی برای مطالعه و اشتراک‌گذاری" \
            "release-assets/llm-for-humans-book-print.pdf#نسخه کم‌مصرف با پس‌زمینه سفید برای چاپ" \
            "release-assets/llm-for-humans-book-high-quality.pdf#نسخه تمام‌رنگی باکیفیت برای نمایش و آرشیو" \
            "release-assets/SHA256SUMS.txt#هش‌های SHA-256" \
            "release-assets/manifest.json#فراداده ماشین‌خوان ساخت" \
            "${flags[@]}"

          echo "Draft release $VERSION is ready for review and manual publication."
